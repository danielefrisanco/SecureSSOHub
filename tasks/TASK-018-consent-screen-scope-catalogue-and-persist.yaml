    reuses it) instead of a stub. (3) Hub rules hook into Doorkeeper by prepend from config/initializers/doorkeeper.rb
    after_initialize: OAuth::AuthorizationRules on Doorkeeper::OAuth::PreAuthorization (validate_* overrides)
    and OAuth::AuthorizationGuard on Doorkeeper::AuthorizationsController — add the non-admin admin:*
    -> invalid_scope rule and the consent skip in that pattern (skip_authorization block in the initializer
    is fine too). (4) Verify the consent form carries the resource parameter (custom_access_token_attributes
    [:resource]) and code_challenge through GET /oauth/authorize -> Allow POST; spec/requests/oauth/authorize_spec.rb
    has helpers (params_for/authorize/approve/callback) to reuse; its ''happy path'' examples currently
    assume no consent skip. (5) Locale file config/locales/doorkeeper.en.yml already exists (edit, do
    not regenerate). (6) Access-token JWTs have no jti until TASK-019: identical claims in the same second
    collide on the unique token column — use distinct users/clients or Timecop.travel in specs.'
