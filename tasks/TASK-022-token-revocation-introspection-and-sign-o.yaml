id: TASK-022
title: Token revocation, introspection and sign-out-everywhere service
type: feat
status: in_progress
priority: high
created: '2026-09-18'
updated: '2026-09-27'
branch: task/022-token-revocation-introspection-and-sign
depends_on:
- TASK-019
context: 'TODO T19 (audit §5.4, §6.3). Doorkeeper provides `POST /oauth/revoke` (RFC 7009) and

  `POST /oauth/introspect` (RFC 7662); this task configures them for the hub''s JWT tokens and adds

  the service operations that later UI/MCP tasks call.


  Revocation (RFC 7009): the client authenticates (confidential: secret; public: only its own

  tokens, identified by client_id + the token itself); `token_type_hint` honoured; revoking a

  refresh token revokes its access tokens; response is 200 even for unknown tokens (spec). Because

  access tokens are self-contained JWTs, revocation is effective for: the hub''s own API/MCP

  (TASK-020 checks the token record), introspection callers, and refresh. Document in

  docs/ARCHITECTURE.md §3 the trade-off: resource servers that verify offline must accept up to

  10 minutes of post-revocation validity or call introspection for sensitive operations.


  Introspection (RFC 7662): only authenticated confidential clients holding the `introspect`

  scope (or a per-client `allow_introspection` flag — pick one, document) may introspect;

  Doorkeeper `allow_token_introspection` block implements the rule. Response: `active`, `scope`,

  `client_id`, `username` (sso_id), `token_type`, `exp`, `iat`, `sub`, `aud`, `iss`, `jti` —

  and `active: false` (nothing else) for revoked/expired/unknown tokens or unauthorised callers.


  Service layer (`OAuth::Tokens`): `revoke(token_string_or_jti, by:)`, `revoke_all_for(user:)`

  ("sign out everywhere": every access + refresh token of the user, all clients),

  `revoke_for(user:, client:)` (used by consent revocation, TASK-018), `revoke_all_for_client(client:)`

  (used by client revoke, TASK-016), `active_for(user:)` listing (id, client name, scopes,

  created/expires, last used) for the Phase 3 account page and Phase 4 MCP. Devise sign-out does

  NOT revoke tokens (a user signing out of the hub keeps their apps working) — but a Devise

  `after_set_user`/lockable lock and `disabled_at` set by an admin call `revoke_all_for`.

  Password change → `revoke_all_for` as well (Devise `after_password_reset`/update hook) — spec.


  Specs (spec/requests/oauth/revoke_spec.rb, introspect_spec.rb, spec/services/oauth/tokens_spec.rb):

  revoke by confidential client (basic auth), by public client for its own token only, cross-client

  revocation refused (RFC: 200 but no effect — spec asserts the token stays active), refresh→access

  cascade, unknown token 200; introspection happy path with exact fields, inactive for revoked/

  expired/unknown, 401 for unauthenticated, active:false for a client without the right;

  service specs for each operation; password change and admin disable revoke everything.

  '
acceptance_criteria:
- POST /oauth/revoke follows RFC 7009 (client auth, type hint, cascade, 200 for unknown, no cross-client
  effect) with specs
- POST /oauth/introspect follows RFC 7662, restricted to authorised confidential clients, returns the
  listed fields for active tokens and only active:false otherwise, with specs
- OAuth::Tokens implements revoke / revoke_all_for(user:) / revoke_for(user:, client_uid:) / the existing
  revoke_all(client_uid:) / active_for(user:) with service specs; password change and admin disable revoke
  all of a user's tokens
- docs/ARCHITECTURE.md §3 documents the JWT revocation trade-off and the recommended resource-server behaviour;
  Doorkeeper isolation spec passes; rspec/rubocop/brakeman pass
plan:
- Configure revocation + introspection in the Doorkeeper initializer; verify behaviours for the installed
  version.
- OAuth::Tokens operations + specs; Devise hooks for password change / disable.
- Request specs for both endpoints; ARCHITECTURE note; suite; closing note.
