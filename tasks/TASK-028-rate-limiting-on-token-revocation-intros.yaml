context: "TODO T24. TODO T24 (audit §5.1: per-client and per-IP limits on /oauth/token, sign-in and password\
  \ reset).\nRe-planned at the Phase 1 gate: Rails 8 ships `ActionController::RateLimiting` (`rate_limit\
  \ to:,\nwithin:, by:, with:, store:`), backed by the shared cache from TASK-027 — no rack-attack gem.\n\
  \nWhere\n- Doorkeeper's TokensController (`/oauth/token`, `/oauth/revoke`, `/oauth/introspect`): add\
  \ the\n  limits through a module in app/services/oauth prepended from config/initializers/doorkeeper.rb\n\
  \  (the Doorkeeper isolation rule; see OAuth::RevocationRules for the pattern). Key by client_id\n \
  \ when present and by remote IP otherwise.\n- Devise sign-in (`POST /users/sign_in`) and password reset\
  \ (`POST /users/password`): by IP, and by\n  submitted email for sign-in.\n- `POST /oauth/register`\
  \ (ClientRegistrationsController): by IP, replacing TASK-025's hourly DB\n  count in OAuth::DynamicRegistration\
  \ (keep the `registration_ip` column — administrators review\n  it). Keep the 24-hour duplicate check.\n\
  - Responses: 429 with `Retry-After`; OAuth endpoints answer an RFC 6749-style JSON error\n  (`temporarily_unavailable`,\
  \ as TASK-025 does), HTML forms show a flash.\n- Limits from env with documented defaults (README);\
  \ behind a proxy they depend on trusted-proxy\n  configuration (TASK-033 sets it)."
acceptance_criteria:
- 'Token, revoke and introspect endpoints are rate limited per client_id (per IP without one) through
  an OAuth:: module wired in the Doorkeeper initializer; 429 + Retry-After + JSON error, spec''d'
- Sign-in and password reset are rate limited per IP (and per email for sign-in); spec'd
- POST /oauth/register uses the same mechanism; the DB-count cap in OAuth::DynamicRegistration is removed
  and its specs adapted
- Limits are configurable from env with defaults documented in README; counters live in the shared cache
- rspec/rubocop/brakeman pass; Doorkeeper isolation spec passes
plan:
- Read ActionController::RateLimiting (Rails 8.1) and pick keys/windows.
- OAuth endpoints module + initializer wiring; Devise controllers; registration.
- Specs per endpoint (cache store in tests must count); README.
- Suite; closing note.
