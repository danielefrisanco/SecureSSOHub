  text: 'DONE (commit): config/initializers/header_guard.rb mounts HeaderGuard::Middleware with content_security_policy:
    false (all other headers = gem defaults; HSTS kept in every env since browsers ignore it over plain
    HTTP, which lets the suite assert the production header set). config/initializers/content_security_policy.rb
    is no longer commented out: it now holds the enforced policy (default/base/font/form/frame-ancestors
    none/img data/object none/connect/script/style all self, upgrade-insecure-requests in production)
    with a fresh SecureRandom nonce per request on script-src - kept in Rails because header_guard 0.3.1
    has no per-request nonce support (gem follow-up T46, documented in both files). spec/requests/security_headers_spec.rb:
    header set on /, CSP nonce present and equal on every inline <script> and the csp-nonce meta tag,
    same headers on Devise pages. Verified: rspec 23 examples 0 failures; headers printed via rails runner.'
