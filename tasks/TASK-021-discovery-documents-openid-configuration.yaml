id: TASK-021
title: Discovery documents — openid-configuration and oauth-authorization-server
type: feat
status: todo
priority: high
created: '2026-09-18'
updated: '2026-09-18'
branch: null
depends_on: [TASK-019]
context: |
  TODO T18 (audit §5.4). Clients (omniauth-ssoprovider is configured by hand, but generic OIDC
  clients and MCP clients discover the server) need RFC 8414 / OIDC Discovery metadata.

  - `GET /.well-known/openid-configuration` — doorkeeper-openid_connect serves it; configure so
    the document is complete and truthful: issuer (HUB_ISSUER), authorization/token/userinfo/
    jwks_uri (`/.well-known/jwks.json`, TASK-015), revocation_endpoint and introspection_endpoint
    (TASK-022, add now — the routes exist from Doorkeeper), registration_endpoint (TASK-025 —
    include only once that task lands; until then omit), scopes_supported = OAuth::Scopes ids,
    response_types_supported ["code"], grant_types_supported ["authorization_code",
    "refresh_token", "client_credentials"], code_challenge_methods_supported ["S256"],
    token_endpoint_auth_methods_supported ["client_secret_basic", "client_secret_post", "none"],
    id_token_signing_alg_values_supported ["RS256"], subject_types_supported ["public"],
    claims_supported (sub, iss, aud, exp, iat, auth_time, nonce, name, email, email_verified,
    admin), `service_documentation` → README URL. Verify which of these doorkeeper-openid_connect
    emits natively and add the rest through its configuration hooks (or a decorator controller
    kept inside app/services/oauth + a thin controller).
  - `GET /.well-known/oauth-authorization-server` (RFC 8414) — same content minus OIDC-only
    fields; MCP clients look here first. Implement as a controller action rendering the shared
    metadata builder (`OAuth::Metadata.document(oidc: true|false)`).
  - Both: `Cache-Control: public, max-age=300`, ETag/304, `application/json`, CORS `GET` from any
    origin (discovery is public — rack-cors config for exactly these paths + jwks; the full
    rack-cors policy is T28).
  - Spec: JSON-schema-like assertions on every field above, absolute URLs built from HUB_ISSUER
    (not from the request host — a spoofed Host header must not change the document), cache
    headers, 304, CORS headers present on discovery paths and absent on /oauth/token.
acceptance_criteria:
- >-
  /.well-known/openid-configuration and /.well-known/oauth-authorization-server both return 200
  JSON with every field listed in the context, URLs derived from HUB_ISSUER regardless of the
  request Host header
- >-
  Both documents carry Cache-Control public max-age=300, ETag with working 304, and CORS headers
  allowing cross-origin GET; /oauth/token does not get CORS headers
- >-
  OAuth::Metadata is the single builder used by both endpoints; a spec fails if scopes_supported
  drifts from OAuth::Scopes or if a Doorkeeper-mounted endpoint URL changes
- >-
  rspec/rubocop/brakeman pass; Doorkeeper isolation spec passes
plan:
- Inspect what doorkeeper-openid_connect emits; implement OAuth::Metadata and wire/override.
- RFC 8414 endpoint + route; cache headers; minimal rack-cors for discovery/jwks paths.
- Specs incl. Host-spoofing and CORS scoping; suite; closing note.
