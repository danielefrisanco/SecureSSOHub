context: "TODO T11 (audit §5.1, §5.2, §6.3). Access tokens (doorkeeper-jwt) and id_tokens\n(doorkeeper-openid_connect)\
  \ must be signed with the hub's private key; every client and resource\nserver verifies with the published\
  \ JWKS via rack-jwt-verifier. The private key never leaves the\nhub (ARCHITECTURE §3).\n\nDesign\n-\
  \ `SigningKey` (app/services/oauth/signing_key.rb or app/lib): loads keys from the environment:\n  `OIDC_SIGNING_KEY`\
  \ (PEM, RSA 2048+; base64-wrapped PEM accepted because .env files dislike\n  newlines) is the current\
  \ key; `OIDC_SIGNING_KEY_PREVIOUS` (optional, same format) stays\n  published in the JWKS so tokens\
  \ signed before a rotation still verify until they expire.\n  `kid` = RFC 7638 JWK thumbprint (SHA-256,\
  \ base64url) computed from the public key — stable,\n  no extra env var. Algorithm RS256 (ES256 optional\
  \ later; keep the class algorithm-agnostic via\n  OpenSSL::PKey).\n- Boot behaviour: production/staging\
  \ raise a clear error if `OIDC_SIGNING_KEY` is missing or\n  weaker than 2048 bits; development/test\
  \ generate an ephemeral key in memory (replaces the\n  guard from TASK-014). `SECRET_KEY_BASE_DUMMY`\
  \ precompile path must not need the key.\n- Wire doorkeeper-jwt (`secret_key` = private key, `signing_method\
  \ :rs256`, `token_headers`\n  adds `kid`) and doorkeeper-openid_connect (`signing_key`, `signing_algorithm\
  \ :RS256`) to\n  SigningKey — one source of truth, loaded once per process (memoised), not per request.\n\
  - JWKS: doorkeeper-openid_connect serves `/oauth/discovery/keys`; add a route alias\n  `GET /.well-known/jwks.json`\
  \ to the same controller/action (or a tiny controller rendering\n  `SigningKey.jwks`), containing current\
  \ + previous keys with `kid`, `use: \"sig\"`, `alg`. Both\n  respond with `Cache-Control: public, max-age=300`\
  \ and an ETag (`fresh_when`), JSON content type.\n- Tooling: `bin/rails hub:keys:generate` rake task\
  \ prints a fresh RSA-2048 PEM in the base64\n  form expected by the env var and the resulting kid, with\
  \ instructions (never writes files);\n  `bin/rails hub:keys:show` prints the kids currently loaded.\
  \ README \"Configuration\" gains\n  OIDC_SIGNING_KEY / OIDC_SIGNING_KEY_PREVIOUS and a rotation runbook\
  \ (generate → set as\n  PREVIOUS=current, current=new → deploy → after max token lifetime drop PREVIOUS).\n\
  - Specs: SigningKey unit specs (PEM and base64 PEM parsing, kid thumbprint matches an\n  independently\
  \ computed value, previous key optional, weak key rejected, production guard);\n  request specs for\
  \ both JWKS paths (fields, cache headers, ETag 304 on If-None-Match, previous\n  key present when configured);\
  \ a token issued by Doorkeeper::JWT verifies with the JWKS\n  (ruby-jwt `JWT.decode(token, nil, true,\
  \ algorithms: [\"RS256\"], jwks: jwks_hash)`) and carries the\n  kid header.\n"
acceptance_criteria:
- SigningKey loads current (+ optional previous) RSA keys from OIDC_SIGNING_KEY / OIDC_SIGNING_KEY_PREVIOUS
  (PEM or base64 PEM), exposes kid (RFC 7638 thumbprint), private/public keys and `jwks`; keys are loaded
  once per process
- Production boot fails with a clear message when the key is absent or < 2048 bits; development and test
  use an in-memory ephemeral key; asset precompile with SECRET_KEY_BASE_DUMMY still works
- doorkeeper-jwt and doorkeeper-openid_connect both sign with SigningKey (RS256) and tokens carry the
  kid header; spec decodes an issued access token with the JWKS document
- GET /.well-known/jwks.json and GET /oauth/discovery/keys return the same key set (current + previous)
  with kid/use/alg, Cache-Control public max-age=300 and a working ETag (304)
- rake tasks hub:keys:generate and hub:keys:show exist and are covered by a spec that captures their output;
  README documents the env vars and the rotation runbook
- '`bundle exec rspec`, rubocop and brakeman pass'
plan:
- Implement SigningKey with specs (parsing, kid, guard, jwks).
- Wire Doorkeeper::JWT and openid_connect config to it; remove the TASK-014 ephemeral guard.
- JWKS alias route + cache headers + specs (including previous key and 304).
- Rake tasks + README runbook.
- Full suite; closing note.
