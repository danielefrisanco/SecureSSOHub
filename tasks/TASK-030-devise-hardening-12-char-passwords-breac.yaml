context: "TODO T26. TODO T26 (audit §5.1, §10 Q3). Today (config/initializers/devise.rb): `password_length\
  \ = 6..128`,\n`mailer_sender` is the placeholder, no `:confirmable` — so `email_verified` is always\
  \ false in\ntokens/userinfo and omniauth_syncer's `on_conflict: :link` always raises against the hub.\n\
  User modules today: database_authenticatable, recoverable, rememberable, validatable, trackable,\nlockable,\
  \ timeoutable (registerable already off).\n\nGate decision (2026-10-02): email goes over **generic SMTP\
  \ configured from env** — no vendor gem:\n`SMTP_ADDRESS`, `SMTP_PORT`, `SMTP_USERNAME`, `SMTP_PASSWORD`,\
  \ `MAILER_FROM` (and the host for\nlinks from HUB_ISSUER). Development keeps a local delivery method;\
  \ test uses :test.\n\nScope\n- Password length ≥ 12 (Devise config + a spec at the boundary).\n- Breached-password\
  \ check against the HIBP range API (k-anonymity: send the first 5 hex chars of\n  the SHA-1, compare\
  \ suffixes locally; Net::HTTP, short timeout, no gem). Decide and document the\n  behaviour when the\
  \ API is unreachable (recommend: allow, log a warning — availability over\n  blocking sign-up), stub\
  \ it in specs (WebMock is available).\n- `:confirmable` with a migration; existing users: decide whether\
  \ to mark them confirmed (they were\n  created by admins) — record the choice. `email_verified` follows\
  \ `confirmed_at` (TokenPayload,\n  IdToken, userinfo already read it).\n- `mailer_sender` from MAILER_FROM;\
  \ production refuses to boot without SMTP_ADDRESS/MAILER_FROM."
acceptance_criteria:
- Passwords shorter than 12 characters and passwords found in the breached-password range API are refused
  (specs with the API stubbed, including the unreachable case)
- Users are confirmable; confirmation and reset mails are delivered through SMTP settings read from env;
  production boot fails clearly without them; README documents the variables
- email_verified is true in id_token, access token and userinfo once a user is confirmed (spec)
- The decision for existing users' confirmation state is recorded in docs/ARCHITECTURE.md
- rspec/rubocop/brakeman pass
plan:
- Password length + breached check (validator/service) + specs.
- confirmable migration + existing-user decision; mailer config from env.
- email_verified end-to-end spec; README.
- Suite; closing note.
