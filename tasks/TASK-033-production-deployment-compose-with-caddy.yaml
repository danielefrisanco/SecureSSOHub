  \ Gate\ndecision (2026-10-02): **Caddy** terminates TLS with automatic certificates.\n\nScope\n- `docker-compose.prod.yml`:\
  \ web (the existing Dockerfile), db (Postgres 17, password from env),\n  redis (TASK-027), caddy (Caddyfile\
  \ in the repo: reverse proxy to web, automatic HTTPS for\n  `HUB_HOST`, HSTS left to header_guard).\
  \ Every secret and setting from env / an env file the\n  operator provides; nothing hardcoded.\n- Development\
