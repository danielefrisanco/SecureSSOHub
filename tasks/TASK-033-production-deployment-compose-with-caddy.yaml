acceptance_criteria:
- docker-compose.prod.yml runs web, db, redis and Caddy with TLS, configured only from env; the dev compose
  no longer contains a hardcoded password
- A readiness endpoint reports DB, cache and signing-key status (spec), and compose healthchecks use it
- Production logs are JSON lines with request id and client/subject attribution and never contain tokens
  or passwords (spec on the formatter/filter)
- Trusted proxies are configured so remote_ip is the client address behind Caddy (spec); README has the
  deployment runbook
- rspec/rubocop/brakeman pass; docker build succeeds
- The app connects with its own database role that has INSERT and SELECT only on audit_events (no UPDATE/DELETE),
  from TASK-029; spec'd or verified by a documented check
plan:
- Readiness endpoint + spec; trusted proxies + spec.
- JSON logging + filter spec.
- Compose files, Caddyfile, .env.example; README runbook.
- docker build; suite; closing note.
