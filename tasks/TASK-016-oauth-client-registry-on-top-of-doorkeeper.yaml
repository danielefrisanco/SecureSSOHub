id: TASK-016
title: OAuth client registry on top of Doorkeeper applications
type: feat
status: in_progress
priority: critical
created: '2026-09-18'
updated: '2026-09-18'
branch: task/016-oauth-client-registry-on-top-of-doorkeep
depends_on:
- TASK-014
context: "TODO T13 (audit §5.1, §6.3), re-planned for Doorkeeper: `Doorkeeper::Application` already\n\
  provides name, uid (client_id), hashed secret (TASK-014 config), redirect_uri (newline-separated,\n\
  exact-match), scopes and `confidential`. The hub adds the fields it needs for approval-gated\nregistration\
  \ and admin/MCP management, and exposes everything through `OAuth::Clients` (the\nonly place allowed\
  \ to touch Doorkeeper::Application — see the isolation spec from TASK-014).\n\nSchema (migration on\
  \ oauth_applications)\n- `client_type` string, not null, default \"confidential\", in %w[confidential\
  \ public]\n  (mirrors Doorkeeper's `confidential` boolean — keep the two in sync in the model via a\n\
  \  before_validation, or derive one from the other; pick one and document).\n- `approval_state` string,\
  \ not null, default \"approved\" for admin-created, \"pending\" for\n  dynamically registered (TASK-025);\
  \ values pending/approved/revoked; index.\n- `registered_via` string, not null: admin | dynamic.\n-\
  \ `owner_id` bigint nullable FK → users (the admin who created it / the user who registered it).\n-\
  \ `software_id`, `software_version`, `client_uri`, `logo_uri`, `contacts` (jsonb) — RFC 7591\n  metadata,\
  \ nullable.\n- `last_used_at` datetime (touched by the token endpoint later).\n\nRules enforced in a\
  \ thin model extension (`app/models/oauth_client.rb` is NOT allowed — keep\nDoorkeeper::Application\
  \ untouched in app/models; put the validations in a module included from\nthe Doorkeeper initializer\
  \ via `Doorkeeper::Application.include OAuth::ClientRules`, living in\napp/services/oauth/client_rules.rb):\
  \ public clients have no secret usable for auth and must use\nPKCE (TASK-017 enforces at authorize);\
  \ redirect URIs must be absolute https (http allowed only for\nlocalhost/127.0.0.1 and custom schemes\
  \ for native/MCP clients — document the allow-list);\nscopes must be a subset of the catalogue; `approval_state`\
  \ transitions pending→approved,\napproved→revoked, pending→revoked only.\n\n`OAuth::Clients` API (keyword\
  \ args, returns plain `OAuth::Client` Structs or raises\n`OAuth::Clients::Error` subclasses): `list(state:\
  \ nil)`, `find(uid)`, `create(name:, redirect_uris:,\nclient_type:, scopes:, owner:, registered_via:\
  \ :admin)` → returns the client plus the ONE-TIME plain\nsecret (never retrievable again; hashed at\
  \ rest), `update(uid, ...)`, `rotate_secret(uid)` → new\none-time secret, all previous tokens of that\
  \ client stay valid (document), `approve(uid, by:)`,\n`revoke(uid, by:)` → revokes all its tokens (via\
  \ OAuth::Tokens) and blocks authorize/token,\n`usable?(uid)` = approved and not revoked. Authorization:\
  \ every mutating call takes `by:` (a User)\nand raises `OAuth::Clients::Forbidden` unless `by.is_admin`\
  \ (owner-based permissions come later\nwith the account UI). Exception: `register_dynamic(name:, redirect_uris:,\
  \ client_type:, scopes:,\nmetadata:, policy:)` is the ONE entry point that takes no `by:` — it is used\
  \ only by the\nunauthenticated RFC 7591 endpoint (TASK-025), always sets `registered_via: dynamic`,\
  \ sets\n`approval_state` from the policy (pending under approval, approved under open), never accepts\n\
  admin/machine scopes, and is the only way to create a client without an admin actor.\nNo audit log yet\
  \ (T25) — but call sites go through the service so T25 can hook in.\n\nSpecs: migration/schema, ClientRules\
  \ validations (each rule), service specs for every operation\nincluding forbidden calls and state transitions,\
  \ secret hashing (plain secret not stored;\nDoorkeeper `secret_matches?`), factory `:oauth_client` with\
  \ traits :public, :pending, :revoked.\n"
acceptance_criteria:
- Migration adds client_type, approval_state (indexed), registered_via, owner_id FK, RFC 7591 metadata
  columns and last_used_at to oauth_applications; schema.rb regenerated
- OAuth::ClientRules validations (client type/secret consistency, redirect URI allow-list, scope subset,
  approval-state transitions) each have a failing-case spec
- OAuth::Clients implements list/find/create/update/rotate_secret/approve/revoke/usable? with keyword
  args, admin-only mutation (Forbidden otherwise), one-time secret return, plus the no-actor register_dynamic
  entry point restricted to pending/policy-limited clients — with specs for every operation
- spec/factories/oauth_clients.rb provides :oauth_client with :public, :pending and :revoked traits used
  by later tasks
- The Doorkeeper isolation spec still passes (Doorkeeper::Application referenced only under app/services/oauth
  and config/initializers); rspec/rubocop/brakeman pass
plan:
- Migration + schema; factory.
- ClientRules module + include from the Doorkeeper initializer; specs per rule.
- OAuth::Clients service + Client struct + error classes; specs.
- Suite; closing note listing the redirect-URI allow-list rules chosen.
notes:
- at: 2026-09-18 17:13
  text: started on task/016-oauth-client-registry-on-top-of-doorkeep
- at: 2026-09-18 17:21
  text: 'closing: migration 20260918170000 (client_type, approval_state+index, registered_via, owner_id
    FK users, software_id/version, client_uri, logo_uri, contacts jsonb, last_used_at; secret nullable
    for public clients). OAuth::ClientRules included from the Doorkeeper initializer (after_initialize).
    Redirect-URI allow-list: absolute only; https any host; http only loopback (localhost/127.0.0.1/::1);
    private-use schemes only for public clients; no fragment, no userinfo, no OOB urn, no opaque scheme:x.
    Doorkeeper force_ssl_in_redirect_uri set false because ClientRules owns the policy in every env. client_type
    is source of truth; confidential must agree; public => no secret (PKCE only). approval: pending->approved,
    pending->revoked, approved->revoked (final), validated on update. OAuth::Scopes added over the catalogue;
    introspect flagged machine: true so register_dynamic never grants admin/machine scopes. OAuth::Clients:
    list(state:)/find/usable?/create/update/rotate_secret/approve/revoke (admin-only via by:, Forbidden/NotFound/Invalid/InvalidTransition)
    + register_dynamic(policy: :approval|:open). revoke calls OAuth::Tokens.revoke_all(client_uid:) (new).
    update cannot change client_type (register a new client). Rotating a secret keeps issued tokens valid.
    Factory :oauth_client with :public/:pending/:revoked. Known: until TASK-019 adds jti, two tokens with
    identical claims in the same second collide (spec uses different users). rspec 108/0, rubocop, brakeman
    clean.'
