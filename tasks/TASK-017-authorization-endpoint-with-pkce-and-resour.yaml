depends_on:
- TASK-016
context: "TODO T14 (audit §5.4), re-planned for Doorkeeper: `GET /oauth/authorize` is served by Doorkeeper's\n\
  AuthorizationsController. This task hardens and extends it; consent rendering is TASK-018.\n\nRequirements\n\
  - PKCE: `code_challenge` + `code_challenge_method=S256` mandatory for public clients (plain is\n  never\
  \ accepted); allowed (and honoured) for confidential clients. Use Doorkeeper's `force_pkce`\n  when\
  \ available; otherwise a `before_action` in a thin controller subclass registered via\n  `Doorkeeper.configure\
  \ { base_controller }`/route override — whichever keeps Doorkeeper::\n  references inside app/services/oauth\
  \ + initializer (isolation spec). Missing/invalid\n  challenge → RFC 6749 `invalid_request` with a description.\n\
  - redirect_uri: exact match against the registered list (Doorkeeper does this — add negative\n  specs:\
  \ different path, extra query, trailing slash, different scheme); when it does not match,\n  render\
  \ the error page — never redirect (open-redirect protection).\n- `state` is echoed back untouched (spec);\
  \ `nonce` (OIDC) is carried into the id_token (spec in\n  TASK-019).\n- Resource indicator (RFC 8707):\
  \ accept an optional `resource` parameter (absolute URI, no\n  fragment); validate it against `OAuth::Resources.known`\
  \ (config list: the hub API resource\n  identifier `#{HUB_ISSUER}/api`, the future MCP resource `#{HUB_ISSUER}/mcp`,\
  \ and per-client\n  registered resources if any); unknown → `invalid_target` error (RFC 8707 §2). Persist\
  \ it on the\n  grant so the token endpoint sets `aud` (Doorkeeper `custom_access_token_attributes [:resource]`\n\
  \  with columns on oauth_access_grants and oauth_access_tokens). When absent, `aud` defaults to\n  the\
  \ client's own client_id (decided here; TASK-019 implements the claim).\n- Client state: pending/revoked\
  \ clients (TASK-016) → `unauthorized_client`; disabled users\n  (`disabled_at`) → sign-out + `access_denied`.\n\
  - Error responses per RFC 6749 §4.1.2.1 (`invalid_request`, `unauthorized_client`,\n  `access_denied`,\
  \ `unsupported_response_type`, `invalid_scope`, `server_error`,\n  `temporarily_unavailable`) — Doorkeeper\
  \ provides most; spec each for both redirectable and\n  non-redirectable cases (bad client_id / bad\
  \ redirect_uri must render, not redirect).\n- `response_type=code` only (deny `token`, implicit is out\
  \ in OAuth 2.1) — spec.\n- Scope validation: requested scopes ⊆ client scopes ⊆ catalogue; `invalid_scope`\
  \ otherwise.\n\nSpecs (spec/requests/oauth/authorize_spec.rb): signed-out → redirect to sign-in with\
  \ return\npath; signed-in happy path (with TASK-018 consent stubbed/skipped) → 302 to redirect_uri with\n\
  code+state; every negative case above; PKCE required for public, optional for confidential;\nresource\
  \ accepted/rejected. Use the :oauth_client factory traits.\n"
acceptance_criteria:
- Public clients cannot obtain a code without S256 PKCE (invalid_request); confidential clients may use
  it; plain method is rejected — all covered by request specs
- redirect_uri mismatches (path, query, trailing slash, scheme, unregistered) render an error page and
  never redirect; state round-trips unchanged
- '`resource` parameter is validated against OAuth::Resources.known, rejected with invalid_target, and
  persisted on the grant (schema columns present) for the token endpoint'
- Pending/revoked clients get unauthorized_client; disabled users get access_denied; response_type=token
  is refused; out-of-catalogue or out-of-client scopes get invalid_scope
- Doorkeeper isolation spec still passes; rspec/rubocop/brakeman pass
plan:
- Read Doorkeeper's authorization request flow for the installed version; decide force_pkce vs before_action;
  note it.
- Implement OAuth::Resources + resource validation + grant/token columns.
- Add client-state and disabled-user checks in the service layer hook Doorkeeper calls.
- Request specs for all cases; suite; closing note.
