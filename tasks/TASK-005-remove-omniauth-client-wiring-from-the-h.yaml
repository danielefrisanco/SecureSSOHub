  strategy (and fails to boot: LoadError, no camelization for :ssoprovider), config/routes.rb has

  `/auth/:provider` and `/auth/:provider/callback`, app/controllers/omniauth_callbacks_controller.rb

  implements a bespoke redirect-with-JWT-in-query flow, and test/initializers/omniauth_ssoprovider_test.rb

  asserts the client strategy is mounted. Remove all of it. Devise''s own routes stay. If

  omniauth-rails_csrf_protection is no longer referenced, remove it from the Gemfile and say so.'
